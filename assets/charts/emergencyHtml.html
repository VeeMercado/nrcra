<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#07293B; --gap:3px; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent}
  body{font-family:"Nunito Sans",Arial,sans-serif;color:var(--navy);padding:4px 0}
  .rows{display:flex;flex-direction:column;gap:16px}
  .label{font-weight:900;font-size:14px;line-height:1.25;margin:0 0 5px}
  .line{display:flex;align-items:center;gap:8px}
  .dots{display:grid;gap:var(--gap);min-width:0}
  .dot{width:var(--d);height:var(--d);border-radius:50%;background:var(--c)}
  .count{font-weight:600;font-size:14px;white-space:nowrap;min-width:58px}
  /* inline layout: label sits on the left of its dots */
  .inline .row{display:flex;align-items:center;gap:8px}
  .inline .label{margin:0;width:44px;flex:none}

  /* grey static preview, shown in the Wix editor and while the real data loads */
  .stage{position:relative;min-height:100vh}
  .stage.grey .rows{filter:grayscale(1);opacity:.5}
  .note{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .note div{background:rgba(255,255,255,.93);border:1px solid #B9C7CD;border-radius:8px;padding:10px 14px;max-width:92%;font:600 12px/1.45 "Nunito Sans",Arial,sans-serif;text-align:center;color:var(--navy)}
  .note p{margin:0 0 4px}.note p:last-child{margin:0}
  .stage:not(.grey) .note,.stage.live .note{display:none}
</style>
</head>
<body>
<div class="stage grey" id="stage">
  <div class="rows" id="rows"></div>
  <div class="note"><div>
    <p>Graph content must be updated in the Wix CMS data collection named &lsquo;Our Networks Progress Master Sheet&rsquo;</p>
    <p>Click Test or Publish the page (top right buttons in Wix Editor)</p>
    <p>to see the graph populated</p>
  </div></div>
</div>

<script>
  // ---- Settings for this chart ----
  var TYPE = "emergency";            // the message type the Wix page code sends
  var INLINE = false;          // true: label beside the dots, false: label above them
  var MIN_LINES = 2;     // fewest lines of dots in a row
  var MIN_DOT = 12;                // smallest circle (px) before another line of dots is added
  var SORT = true;              // true: biggest row first
  var ROWS = [
    { key: "rfs", field: "rSWithRfs",    label: "RFS",    colour: "#F05A28" },
    { key: "ses", field: "rSWithSes",    label: "SES",    colour: "#00A79D" },
    { key: "police", field: "rSWithPolice", label: "Police", colour: "#07293B" }
  ];
  // ---------------------------------
  var stage = document.getElementById("stage");
  var data = { rfs: 24, ses: 23, police: 3 };      // grey static preview numbers

  function draw() {
    var host = document.getElementById("rows");
    host.innerHTML = "";
    document.body.className = INLINE ? "inline" : "";
    if (!data) { return; }

    var names = data.labels || {};
    // The label is the CMS column name where there is one, otherwise the typed label
    var list = ROWS.map(function (r) { return { label: (r.field && names[r.field]) || r.label, colour: r.colour, n: Number(data[r.key]) || 0 }; });
    if (SORT) { list.sort(function (a, b) { return b.n - a.n; }); }
    var maxN = Math.max(1, Math.max.apply(null, list.map(function (r) { return r.n; })));

    // Work out one circle size that fits the biggest row, adding another line of dots if they would be too small
    var gap = 3, countW = 58 + 8, labelW = INLINE ? 44 + 8 : 0;
    var avail = window.innerWidth - 8 - countW - labelW;
    var lines = MIN_LINES, cols, d;
    for (;;) {
      cols = Math.ceil(maxN / lines);
      d = (avail - (cols - 1) * gap) / cols;
      if (d >= MIN_DOT || lines >= 8) { break; }
      lines++;
    }
    d = Math.max(5, Math.min(16, Math.floor(d * 10) / 10));
    document.documentElement.style.setProperty("--d", d + "px");

    list.forEach(function (r) {
      var row = document.createElement("div");
      row.className = "row";
      row.setAttribute("role", "img");
      row.setAttribute("aria-label", r.label + ": " + r.n + (r.n === 1 ? " group" : " groups"));

      var label = document.createElement("p");
      label.className = "label"; label.textContent = r.label;

      var line = document.createElement("div");
      line.className = "line";
      var dots = document.createElement("div");
      dots.className = "dots";
      dots.style.gridTemplateColumns = "repeat(" + Math.max(1, Math.ceil(r.n / lines)) + "," + d + "px)";
      for (var i = 0; i < r.n; i++) {
        var dot = document.createElement("span");
        dot.className = "dot"; dot.style.setProperty("--c", r.colour);
        dots.appendChild(dot);
      }
      var count = document.createElement("span");
      count.className = "count"; count.textContent = r.n + (r.n === 1 ? " group" : " groups");
      line.appendChild(dots); line.appendChild(count);

      row.appendChild(label); row.appendChild(line);
      host.appendChild(row);
    });
  }

  // 1. Grey static preview straight away (what the Wix editor shows)
  draw();

  // 2. Messages from the Wix page code
  window.addEventListener("message", function (e) {
    var m = e.data || {};
    if (m.type === "live") { stage.classList.add("live"); }            // real page: hide the editor note
    if (m.type === TYPE) {                                             // real numbers: replace the grey preview
      data = m; stage.classList.remove("grey"); stage.classList.add("live"); draw();
    }
  });
  window.addEventListener("resize", draw);
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "ready" }, "*");
  }
  // Preview outside Wix: add ?demo=1 to see the real chart
  if (location.search.indexOf("demo=1") > -1) { stage.classList.remove("grey"); stage.classList.add("live"); draw(); }
</script>
</body>
</html>
