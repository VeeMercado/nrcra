<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grassroots Groups in Numbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,800;1,400&display=swap">
<style>
  html, body { margin: 0; }
  /* Layout: funding headline and prompt on top, three stat buttons in a row, then one disc of 60 dots.
     White page, Nunito Sans at 400 and 800 only, text colours from the brand guidelines. */
  :root {
    --bg: #FFFFFF;
    --ink: #07293b;
    --ink-soft: #586C74;
    --edge: #C5D2D6;
    --stage: #0B1D22;
    --teal: #00A79D;
    --teal-pale: #BEDDDA;
    --yellow: #FFCB2A;
    --orange: #F05A28;
    --teal-text: #00857C;
    --yellow-text: #B38C00;
    --font: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 1rem;
    line-height: 1.5;
    padding-block: 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 960px; margin-inline: auto; display: flex; flex-direction: column; align-items: center; gap: clamp(28px, 5vw, 44px); }

  .stats { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(8px, 2vw, 20px); }
  .stat {
    --c: var(--teal-text);
    appearance: none;
    font: inherit;
    color: var(--ink);
    text-align: left;
    background: var(--bg);
    border: 0;
    border-bottom: 4px solid transparent;
    border-radius: 12px;
    padding: clamp(8px, 1.6vw, 14px) 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
    transition: border-color .25s ease, transform .25s ease;
  }
  .stat[data-i="1"] { --c: var(--yellow-text); }
  .stat[data-i="2"] { --c: var(--orange); }
  .stat:hover, .stat[aria-pressed="true"] { border-bottom-color: var(--ink); }
  .stat:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .num {
    display: block;
    color: var(--c);
    font-weight: 800;
    font-size: clamp(1.375rem, 2.4vw, 1.5rem);
    line-height: 1.2;
    text-wrap: balance;
  }
  .label { font-weight: 400; font-size: 1rem; color: var(--ink); text-wrap: balance; }

  .stage { width: min(100%, 480px); }
  .disc { width: 100%; height: auto; display: block; }
  .dot { transition: fill .45s ease, transform .6s cubic-bezier(.3,.7,.2,1); transition-delay: var(--d, 0ms); }

  .intro { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; max-width: 720px; }
  .intro h2 { margin: 0; color: var(--ink); font-weight: 800; font-size: clamp(1.875rem, 4vw, 2.375rem); line-height: 1.15; text-wrap: balance; }
  .hint { color: var(--ink-soft); font-size: 0.9375rem; font-style: italic; font-weight: 400; margin: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 479px) { .stats { grid-template-columns: 1fr; } }

  @media (prefers-reduced-motion: reduce) {
    .dot, .stat { transition: none; transition-delay: 0ms; }
  }
</style>

<main class="wrap">
  <h1 class="sr">Grassroots groups in numbers</h1>

  <div class="intro">
    <h2>$2M+ in funding since inception has enabled:</h2>
    <p class="hint">Interact with the numbers</p>
  </div>

  <div class="stats" role="group" aria-label="Choose a number to highlight it in the circle of dots">
    <button class="stat" type="button" data-i="0" aria-pressed="true">
      <span class="num">60+ grassroots groups</span>
      <span class="label">and organisations to prepare</span>
    </button>
    <button class="stat" type="button" data-i="1" aria-pressed="false">
      <span class="num">43 groups</span>
      <span class="label">that have experienced disasters as a team to continue to thrive</span>
    </button>
    <button class="stat" type="button" data-i="2" aria-pressed="false">
      <span class="num">35 groups</span>
      <span class="label">have built strong relationships with local government</span>
    </button>
  </div>

  <div class="stage">
    <svg class="disc" viewBox="0 0 400 400" role="img" aria-label="A circle made of 60 dots. The dots change colour to show how many groups each number covers.">
      <g id="dots"></g>
    </svg>
  </div>

  <p class="sr" id="live" aria-live="polite"></p>
</main>

<script>
(function () {
  var TOTAL = 60;                       // dots in the circle
  var STATS = [
    { n: 60, text: "60+ grassroots groups and organisations to prepare", color: null },
    { n: 43, text: "43 groups that have experienced disasters as a team to continue to thrive", color: "#FFCB2A" },
    { n: 35, text: "35 groups have built strong relationships with local government", color: "#F05A28" }
  ];
  var TEALS = ["#00A79D", "#00857C", "#BEDDDA"];
  var GREY = "#586C74";
  var NS = "http://www.w3.org/2000/svg";

  // Small seeded random so the teal mix is the same every visit
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var rand = rng(62);

  // Sunflower layout fills a disc evenly
  var CX = 200, CY = 200, R = 158, GOLD = Math.PI * (3 - Math.sqrt(5));
  var pts = [];
  for (var i = 0; i < TOTAL; i++) {
    var r = R * Math.sqrt((i + 0.5) / TOTAL), a = i * GOLD;
    pts.push({ x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) });
  }

  // Rank dots from the left so the first N sit on the left side
  var order = pts.map(function (p, idx) { return idx; }).sort(function (a, b) { return pts[a].x - pts[b].x || pts[a].y - pts[b].y; });
  var rank = []; order.forEach(function (idx, k) { rank[idx] = k; });

  var tealFill = pts.map(function () { var v = rand(); return v < 0.42 ? TEALS[0] : v < 0.84 ? TEALS[1] : TEALS[2]; });

  var g = document.getElementById("dots");
  var circles = pts.map(function (p, idx) {
    var c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", p.x.toFixed(1)); c.setAttribute("cy", p.y.toFixed(1)); c.setAttribute("r", 15);
    c.setAttribute("class", "dot"); c.setAttribute("fill", tealFill[idx]);
    c.style.setProperty("--d", (rank[idx] * 7) + "ms");
    g.appendChild(c); return c;
  });

  function centroid(list) {
    var sx = 0, sy = 0; list.forEach(function (k) { sx += pts[k].x; sy += pts[k].y; });
    return { x: sx / list.length, y: sy / list.length };
  }

  function show(i) {
    var s = STATS[i], n = s.n;
    if (i === 0) {
      circles.forEach(function (c, k) { c.style.fill = tealFill[k]; c.style.transform = "translate(0px,0px)"; });
      return;
    }
    var on = [], off = [];
    for (var k = 0; k < TOTAL; k++) (rank[k] < n ? on : off).push(k);
    var co = centroid(on), cg = centroid(off), pull = 0.1, push = 11;
    on.forEach(function (k) {
      circles[k].style.fill = s.color;
      circles[k].style.transform = "translate(" + ((co.x - pts[k].x) * pull - push).toFixed(1) + "px," + ((co.y - pts[k].y) * pull).toFixed(1) + "px)";
    });
    off.forEach(function (k) {
      circles[k].style.fill = GREY;
      circles[k].style.transform = "translate(" + ((cg.x - pts[k].x) * pull + push).toFixed(1) + "px," + ((cg.y - pts[k].y) * pull).toFixed(1) + "px)";
    });
  }

  var buttons = Array.prototype.slice.call(document.querySelectorAll(".stat"));
  var live = document.getElementById("live");
  var pinned = 0;

  function setPinned(i) {
    pinned = i;
    buttons.forEach(function (b, k) { b.setAttribute("aria-pressed", String(k === pinned)); });
    live.textContent = STATS[pinned].text;
    show(pinned);
  }

  buttons.forEach(function (b, i) {
    b.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse") show(i); });
    b.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") show(pinned); });
    b.addEventListener("focus", function () { show(i); });
    b.addEventListener("blur", function () { show(pinned); });
    b.addEventListener("click", function () { setPinned(pinned === i && i !== 0 ? 0 : i); });
  });

  show(0);

  // Tell the page that embeds this one how tall it needs to be
  function sendHeight() {
    var h = document.documentElement.scrollHeight;
    try { parent.postMessage({ type: "nrcra-embed-height", id: "journey-numbers", height: h }, "*"); } catch (err) {}
  }
  window.addEventListener("load", sendHeight);
  window.addEventListener("resize", sendHeight);
  if (window.ResizeObserver) new ResizeObserver(sendHeight).observe(document.body);
})();
</script>
</body>
</html>
