sh-screenshot-svg-container" style="left: 0px; top: 0px; width: 794px; height: 426px; position: absolute;" x="0" y="0"><text x="10.5px" y="56.322000122070314px" font-family="Nunito Sans" font-size="28px" font-weight="700" fill="rgb(7, 40, 59)"><tspan dx="0" x="10.5" opacity="1">Small teams do the</tspan><tspan dy="35px" dx="0" x="10.5" opacity="1">heavy lifting</tspan></text><text x="10.5px" y="125.25035083414713px" font-family="Nunito Sans" font-size="19.6px" font-weight="400" fill="rgb(7, 40, 59)"><tspan dx="0" x="10.5" opacity="1">Most of us run on a core</tspan><tspan dy="23.5167px" dx="0" x="10.5" opacity="1">team of 10 or less active</tspan><tspan dy="23.5167px" dx="0" x="10.5" opacity="1">volunteers</tspan></text><text x="10.5px" y="198.03400319417318px" font-family="Nunito Sans" font-size="14px" font-weight="400" fill="rgb(7, 40, 59)"><tspan dx="0" x="10.5" opacity="1">This weighs heavily on our groups, who</tspan><tspan dy="16.8px" dx="0" x="10.5" opacity="1">would welcome more hands to prepare</tspan><tspan dy="16.8px" dx="0" x="10.5" opacity="1">for, and recover from, disasters.</tspan></text><text x="0px" y="11.984000142415365px" font-family="Nunito Sans" font-size="14px" font-weight="400" fill="rgb(7, 40, 59)"><tspan dx="0" x="0" opacity="1"></tspan></text></svg></svg>